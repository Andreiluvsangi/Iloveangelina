<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Was gibt es?</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="intro">
  <audio id="bgm" src="steinsgate_intro.mp3" loop autoplay></audio>

  <div class="center">
    <h1>Was gibt es?</h1>
    <input type="text" id="pass" placeholder="Antwort eingeben">
    <button onclick="checkPass()">OK</button>
    <p id="error" class="error"></p>
  </div>

  <script>
    function checkPass() {
      const val = document.getElementById("pass").value.trim();
      const error = document.getElementById("error");
      if(val === "Non est nisi amor") {
        window.location = "main.html";
      } else {
        error.textContent = "Falsch — versuche es noch einmal.";
      }
    }
  </script>
</body>
</html>
