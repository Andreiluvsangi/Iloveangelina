<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hauptseite</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="main">
  <audio id="bgm" src="sakura.mp3" loop autoplay></audio>

  <div class="center">
    <h1>✨ Willkommen ✨</h1>
    <button onclick="location.href='love.html'">Warum ich dich so liebe</button>
    <button onclick="location.href='appreciate.html'">Warum ich dich so schätze</button>
    <button onclick="location.href='everything.html'">Warum du mein alles bist</button>
  </div>

  <div id="petals"></div>

  <script>
    const petals = document.getElementById("petals");
    const petalImages = ["petal1.png", "petal2.png"];

    for(let i = 0; i < 40; i++) {
      let p = document.createElement("img");
      p.src = petalImages[Math.floor(Math.random()*petalImages.length)];
      p.className = "petal";

      // Random horizontal position
      p.style.left = Math.random()*100 + "%";

      // Random size
      let size = 20 + Math.random()*20;
      p.style.width = size + "px";
      p.style.height = "auto";

      // Random animation duration
      let fallDuration = 5 + Math.random()*5;
      let spinDuration = 3 + Math.random()*3;
      p.style.animation = `fall ${fallDuration}s linear infinite, spin ${spinDuration}s linear infinite`;

      petals.appendChild(p);
    }
  </script>
</body>
</html>
